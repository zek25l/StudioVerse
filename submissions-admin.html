<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudioVerse - Submission review</title>
<style>
:root{--navy:#0b1026;--ink:#161b35;--muted:#727892;--line:#e5e8f4;--paper:#f5f7fc;--blue:#2d72ff;--green:#168d67;--red:#c24f61}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 90% 0,#e6edff 0,transparent 32%),var(--paper);font-family:Arial,sans-serif}button,input{font:inherit}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1120px)/2));color:#fff;background:linear-gradient(110deg,#0b1026,#171946)}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:18px;font-weight:900;text-decoration:none}.brand img{width:34px;height:34px;border-radius:9px}.top a:last-child{color:#c0cbef;font-size:12px;font-weight:800;text-decoration:none}.gate{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:25px}.gate-card{width:min(100%,390px);padding:34px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 22px 70px #1f275b18;text-align:center}.lock{width:60px;height:60px;display:grid;place-items:center;margin:0 auto 20px;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--blue),#7954e8);font-size:24px}.gate h1{margin:0 0 8px;font-size:29px;letter-spacing:-.06em}.gate p{margin:0 0 22px;color:var(--muted);font-size:12px;line-height:1.5}.gate input{width:100%;height:45px;border:1px solid var(--line);border-radius:8px;padding:0 12px;outline:0}.primary{width:100%;margin-top:12px;border:0;border-radius:8px;padding:13px;color:#fff;background:var(--blue);font-size:12px;font-weight:800;cursor:pointer}.error{min-height:16px;color:var(--red);font-size:11px}.dashboard{display:none;max-width:920px;margin:auto;padding:42px 20px 70px}.dashboard.open{display:block}.eyebrow{margin:0 0 9px;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.dashboard h1{margin:0;font-size:42px;letter-spacing:-.06em}.intro{margin-bottom:28px}.intro p:last-child{max-width:590px;color:var(--muted);line-height:1.55}.panel{padding:28px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 18px 50px #1f275b12}.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center}.toolbar h2{margin:0;font-size:21px}.count{color:var(--muted);font-size:11px}.submission{padding:21px 0;border-bottom:1px solid var(--line)}.submission:last-child{border-bottom:0}.submission h3{margin:0 0 9px;font-size:15px}.submission-meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:11px}.submission-meta span{padding-right:8px;border-right:1px solid var(--line)}.submission-meta span:last-child{border:0}.status{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;color:var(--green);background:#e4f7ef;font-size:10px;font-weight:800;text-transform:uppercase}.status.rejected{color:var(--red);background:#fff0f2}.submission p{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.55;white-space:pre-wrap}.actions{display:flex;gap:8px;margin-top:14px}.actions button{border:0;border-radius:7px;padding:9px 12px;color:#fff;background:var(--blue);font-size:11px;font-weight:800;cursor:pointer}.actions .reject{color:var(--ink);background:var(--line)}.actions button:disabled{opacity:.5;cursor:not-allowed}.empty{padding:28px 0;color:var(--muted);font-size:12px}.notice{margin:16px 0 0;color:var(--red);font-size:12px}@media(max-width:600px){.top{padding:0 15px}.dashboard{padding:30px 15px 55px}.dashboard h1{font-size:35px}.panel{padding:22px 18px}.toolbar{align-items:flex-start;flex-direction:column;gap:7px}}
</style>
<style>
:root{--navy:#050816;--ink:#edf1ff;--muted:#a5aec8;--line:#29324d;--paper:#0c1224;--blue:#78a7ff;--green:#58d6a5;--red:#ff7f94}body{background:radial-gradient(circle at 90% 0,#1b2550 0,transparent 32%),var(--paper)}.top{background:#0c1224;border-color:var(--line)}.panel,.gate-card{background:#111a30;border-color:var(--line);box-shadow:0 22px 70px #00000045}.gate input{color:var(--ink);background:#0c1224;border-color:var(--line)}.primary{color:#050816;background:#edf1ff}.submission{border-color:var(--line)}.submission-meta,.submission p,.empty{color:var(--muted)}.actions .reject{color:var(--ink);background:var(--line)}
</style>
</head>
<body>
<header class="top"><a class="brand" href="Index.html"><img src="Images/ZANVERSE.png" alt="StudioVerse logo">StudioVerse</a><a href="admin.html">Open listing manager</a></header>
<section class="gate" id="gate"><div class="gate-card"><div class="lock">*</div><h1>Submission review</h1><p>Use the same StudioVerse owner passcode to review creator applications.</p><form id="gate-form"><input id="owner-code" type="password" minlength="8" placeholder="Owner passcode" required><p class="error" id="gate-error"></p><button class="primary" type="submit">Unlock submissions</button></form></div></section>
<main class="dashboard" id="dashboard"><div class="intro"><p class="eyebrow">Private creator desk</p><h1>Review submissions.</h1><p>Read each creator's details, then mark the application approved or rejected.</p></div><section class="panel"><div class="toolbar"><h2>Creator submissions</h2><span class="count" id="count"></span></div><div id="list"><p class="empty">Loading submissions...</p></div></section></main>
<script>
const $=id=>document.getElementById(id),gateForm=$('gate-form'),gateError=$('gate-error'),dashboard=$('dashboard'),list=$('list'),count=$('count');
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]))}
function readTickets(){try{const tickets=JSON.parse(localStorage.getItem('studioVerseSubmissions')||'[]');return Array.isArray(tickets)?tickets:[]}catch{return[]}}
function renderSubmissions(submissions){count.textContent=submissions.length+' ticket'+(submissions.length===1?'':'s');list.innerHTML=submissions.length?submissions.map(item=>'<article class="submission"><h3>Ticket '+escapeHtml(item.ticketNumber)+' <span class="status '+(item.status==='rejected'?'rejected':'')+'">'+escapeHtml(item.status)+'</span></h3><div class="submission-meta"><span>'+escapeHtml(item.discord||'No Discord')+'</span><span>'+escapeHtml(item.email||'No email')+'</span><span>PayPal: '+escapeHtml(item.paypal)+'</span><span>'+new Date(item.createdAt).toLocaleString()+'</span></div><p>'+escapeHtml(item.details)+'</p>'+(item.additionalInfo?'<p><strong>Additional info:</strong> '+escapeHtml(item.additionalInfo)+'</p>':'')+'<div class="actions"><button data-id="'+item.id+'" data-status="approved">Approve</button><button class="reject" data-id="'+item.id+'" data-status="rejected">Reject</button></div></article>').join(''):'<p class="empty">No creator submissions yet.</p>'}
async function load(){try{const response=await fetch('/api/submissions');if(!response.ok)throw new Error('server');renderSubmissions(await response.json())}catch{renderSubmissions(readTickets())}}
async function signIn(password){try{const response=await fetch('/api/admin/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(response.ok)return}catch{}const bytes=new TextEncoder().encode(password),digest=await crypto.subtle.digest('SHA-256',bytes),hash=Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('');if(hash!=='ad98f59a44425cfc03cd12554b893f26b98a73ef7435e5e01d75478559a6fe84')throw new Error('That passcode is not correct.')}
gateForm.addEventListener('submit',async event=>{event.preventDefault();gateError.textContent='';const button=gateForm.querySelector('button');button.disabled=true;try{await signIn($('owner-code').value);$('gate').style.display='none';dashboard.classList.add('open');await load()}catch(error){gateError.textContent=error.message}finally{button.disabled=false}});
list.addEventListener('click',async event=>{const button=event.target.closest('button[data-status]');if(!button)return;button.disabled=true;try{const response=await fetch('/api/submissions/'+encodeURIComponent(button.dataset.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:button.dataset.status})});if(response.ok){await load();return}}catch{}const submissions=readTickets(),submission=submissions.find(item=>item.id===button.dataset.id);if(submission){submission.status=button.dataset.status;localStorage.setItem('studioVerseSubmissions',JSON.stringify(submissions));renderSubmissions(submissions)}button.disabled=false});
</script>
</body>
</html>
