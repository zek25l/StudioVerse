<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudioVerse - Payment</title>
<style>
:root{--navy:#0b1026;--ink:#161b35;--muted:#727892;--line:#e5e8f4;--paper:#f7f8fc;--blue:#2d72ff;--soft:#eaf1ff}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Arial,sans-serif}.page{max-width:620px;margin:0 auto;padding:48px 20px 70px}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--navy);font-size:19px;font-weight:900;text-decoration:none}.brand img{width:35px;height:35px;border-radius:10px}.panel{margin-top:35px;padding:34px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 18px 50px #1f275b12}.eyebrow{margin:0 0 9px;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.panel h1{margin:0 0 10px;font-size:36px;letter-spacing:-.06em}.panel p{color:var(--muted);font-size:14px;line-height:1.6}.summary{display:flex;justify-content:space-between;gap:20px;margin:25px 0;padding:18px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:800}.amount-label{display:block;margin-top:22px;color:var(--ink);font-size:12px;font-weight:800}.amount{width:100%;height:44px;margin-top:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;outline:0;font-size:16px}.amount:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e5eeff}.paypal{display:block;margin-top:20px;padding:14px;border-radius:8px;color:#fff;background:#0070ba;text-align:center;text-decoration:none;font-size:13px;font-weight:800}.paypal.disabled{pointer-events:none;opacity:.45}.back{display:block;margin-top:18px;color:var(--muted);font-size:12px;text-align:center;text-decoration:none}@media(max-width:560px){.page{padding:28px 15px 50px}.panel{padding:24px 20px}.panel h1{font-size:31px}}
</style>
<style>
:root{--navy:#050816;--ink:#edf1ff;--muted:#a5aec8;--line:#29324d;--paper:#0c1224;--blue:#78a7ff;--soft:#182442}body{background:radial-gradient(circle at 90% 0,#1b2550 0,transparent 32%),var(--paper)}.brand{color:var(--ink)}.panel{background:#111a30;border-color:var(--line);box-shadow:0 18px 50px #00000045}.summary{background:#182442}.amount{color:var(--ink);background:#0c1224;border-color:var(--line)}.amount:focus{box-shadow:0 0 0 3px #2d72ff44}.back{color:var(--muted)}
</style>
</head>
<body>
<main class="page">
<a class="brand" href="Index.html"><img src="Images/ZANVERSE.png" alt="StudioVerse logo">StudioVerse</a>
<section class="panel">
<p class="eyebrow">Secure payment handoff</p>
<h1>Complete your purchase</h1>
<p>StudioVerse uses PayPal for payment. Confirm the CAD amount below, then continue to PayPal to send payment to <strong> BillyJay616</strong>.</p>
<div class="summary"><span id="cart-summary">Cart</span><span>CAD</span></div>
<label class="amount-label" for="amount">Amount to pay (CAD)</label>
<input class="amount" id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal">
<a class="paypal disabled" id="paypal" href="https://www.paypal.com/paypalme/BillyJay616" target="_blank" rel="noopener">Continue to PayPal</a>
<a class="back" href="Index.html">Return to marketplace</a>
</section>
</main>
<script>
const params = new URLSearchParams(location.search);
const count = Math.max(1, Number(params.get('items') || 1));
const summary = document.getElementById('cart-summary');
const amount = document.getElementById('amount');
const paypal = document.getElementById('paypal');
summary.textContent = `${count} asset${count === 1 ? '' : 's'} in your cart`;
amount.addEventListener('input', () => {
  const value = Number(amount.value);
  paypal.classList.toggle('disabled', !(value > 0));
  paypal.href = value > 0 ? `https://www.paypal.com/paypalme/BillyJay616/${value.toFixed(2)}CAD` : 'https://www.paypal.com/paypalme/BillyJay616';
});
</script>
</body>
</html>
